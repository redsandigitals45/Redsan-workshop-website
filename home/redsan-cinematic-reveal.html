<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redsan Digitals — Cinematic Logo Reveal</title>

<!--
  ============================================================================
  REDSAN DIGITALS — CINEMATIC LOGO REVEAL (studio-vanity-card style)
  ============================================================================
  A slow, deliberate reveal: black screen → atmosphere settles (letterbox
  bars, drifting embers, faint glow) → the wordmark pulls into focus out of
  a blur like it's racking into frame, letters converging from wide tracking
  to tight → a single light-catching shine sweeps across the chrome once it
  lands → a rule draws itself out → the tagline settles beneath it → the
  whole thing holds in a slow ambient breathing loop.

  Total run to settle: ~6.5s. This is meant to be watched once per session,
  not skimmed — the pacing is the point.

  INTEGRATION NOTES FOR ANTIGRAVITY:
  1. COPY the Google Fonts <link> tags into <head> if Anton / IBM Plex Mono
     aren't already loaded.
  2. COPY the <style> block in (scoped under #rsd-cinema).
  3. COPY the <div id="rsd-cinema">...</div> markup. It's built as a
     fixed full-viewport overlay — ideal as a one-time splash before the
     real site reveals itself. For an inline hero placement instead,
     remove `position:fixed; inset:0;` from #rsd-cinema and give its
     parent a defined height.
  4. Pure CSS, no JS dependency for the animation itself. The only script
     on the page is the preview-only "Replay" button — delete it in
     production.
  5. If used as a splash, trigger your real hero/page-content fade-in
     around the 5.5–6s mark so it hands off right as the reveal settles.
  6. To change the wordmark text, edit both the visible text in .rsd-word
     AND its matching data-text attribute (used for the shine-sweep
     pseudo-element) — they must stay identical.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html,body{ margin:0; padding:0; background:#000; }

  #rsd-cinema{
    --rsd-black:#000;
    --rsd-red:#E2231A;
    --rsd-red-dim:rgba(226,35,26,.5);
    --rsd-white:#fff;

    position:fixed; /* see integration note 3 */
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:'Anton',sans-serif;
  }
  #rsd-cinema *{ box-sizing:border-box; }

  /* ---------- letterbox bars ---------- */
  #rsd-cinema .rsd-bar{
    position:absolute;
    left:0; right:0;
    height:0;
    background:#000;
    z-index:6;
    animation: rsd-bar-in 1.1s cubic-bezier(.4,0,.2,1) .1s forwards;
  }
  #rsd-cinema .rsd-bar.top{ top:0; }
  #rsd-cinema .rsd-bar.bottom{ bottom:0; }
  @keyframes rsd-bar-in{ to{ height:6.4vh; } }

  /* ---------- film grain (static, subtle) ---------- */
  #rsd-cinema .rsd-grain{
    position:absolute; inset:0;
    z-index:5;
    opacity:0;
    pointer-events:none;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: rsd-grain-in 1.4s ease-out .2s forwards;
  }
  @keyframes rsd-grain-in{ to{ opacity:.18; } }

  /* ---------- vignette ---------- */
  #rsd-cinema .rsd-vignette{
    position:absolute; inset:0;
    z-index:4;
    background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.85) 100%);
    opacity:0;
    animation: rsd-fade-in 1.4s ease-out .2s forwards;
  }

  /* ---------- ember dust ---------- */
  #rsd-cinema .rsd-embers{
    position:absolute; inset:0;
    z-index:1;
    opacity:0;
    animation: rsd-fade-in 1.8s ease-out .5s forwards;
  }
  #rsd-cinema .rsd-ember{
    position:absolute;
    bottom:-4%;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--rsd-red);
    box-shadow:0 0 6px 1px var(--rsd-red-dim);
    opacity:0;
    animation: rsd-ember-rise linear infinite;
  }
  @keyframes rsd-ember-rise{
    0%{ opacity:0; transform:translateY(0) translateX(0); }
    8%{ opacity:.8; }
    92%{ opacity:.5; }
    100%{ opacity:0; transform:translateY(-108vh) translateX(var(--rsd-drift, 20px)); }
  }
  /* hand-placed variety so it doesn't feel like a loop tile */
  #rsd-cinema .rsd-ember:nth-child(1){ left:8%;  --rsd-drift:14px;  animation-duration:13s; animation-delay:.2s; }
  #rsd-cinema .rsd-ember:nth-child(2){ left:18%; --rsd-drift:-18px; animation-duration:16s; animation-delay:2.1s; }
  #rsd-cinema .rsd-ember:nth-child(3){ left:27%; --rsd-drift:10px;  animation-duration:11s; animation-delay:.8s; }
  #rsd-cinema .rsd-ember:nth-child(4){ left:39%; --rsd-drift:-8px;  animation-duration:14.5s; animation-delay:3.4s; }
  #rsd-cinema .rsd-ember:nth-child(5){ left:52%; --rsd-drift:16px;  animation-duration:12s; animation-delay:1.4s; }
  #rsd-cinema .rsd-ember:nth-child(6){ left:61%; --rsd-drift:-14px; animation-duration:15s; animation-delay:.5s; }
  #rsd-cinema .rsd-ember:nth-child(7){ left:71%; --rsd-drift:12px;  animation-duration:13.5s; animation-delay:2.8s; }
  #rsd-cinema .rsd-ember:nth-child(8){ left:83%; --rsd-drift:-10px; animation-duration:17s; animation-delay:1.1s; }
  #rsd-cinema .rsd-ember:nth-child(9){ left:92%; --rsd-drift:8px;   animation-duration:12.5s; animation-delay:3.9s; }
  #rsd-cinema .rsd-ember:nth-child(10){ left:47%; --rsd-drift:-6px; animation-duration:18s; animation-delay:.1s; }

  /* ---------- central glow ---------- */
  #rsd-cinema .rsd-glow{
    position:absolute;
    width:min(70vw, 760px);
    height:min(70vw, 760px);
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,35,26,.5) 0%, rgba(226,35,26,.16) 38%, rgba(226,35,26,0) 70%);
    filter:blur(4px);
    opacity:0;
    transform:scale(.4);
    z-index:1;
    animation:
      rsd-glow-in 2.6s cubic-bezier(.16,1,.3,1) .5s forwards,
      rsd-glow-pulse 7s ease-in-out 3.2s infinite;
  }
  @keyframes rsd-glow-in{ to{ opacity:.6; transform:scale(1); } }
  @keyframes rsd-glow-pulse{
    0%,100%{ opacity:.6; transform:scale(1); }
    50%{ opacity:.45; transform:scale(1.05); }
  }

  /* ---------- stage ---------- */
  #rsd-cinema .rsd-stage{
    position:relative;
    z-index:3;
    text-align:center;
    animation: rsd-stage-breathe 7.4s ease-in-out 6.4s infinite;
  }
  @keyframes rsd-stage-breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.006); }
  }

  #rsd-cinema .rsd-kicker{
    margin:0 0 22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:rgba(255,255,255,.45);
    opacity:0;
    animation: rsd-fade-in 1.2s ease-out .9s forwards;
  }

  #rsd-cinema .rsd-word-wrap{
    position:relative;
    display:inline-block;
  }

  #rsd-cinema .rsd-word{
    position:relative;
    margin:0;
    display:block;
    text-transform:uppercase;
    font-weight:400;
    line-height:.95;
    font-size:clamp(2.2rem, 9.5vw, 6.6rem);
    white-space:nowrap;
    letter-spacing:.62em;
    padding-right:.62em; /* offsets the trailing letter-spacing so it stays centered */

    background:linear-gradient(180deg, #ffffff 0%, #e4e6ea 22%, #ffffff 46%, #b9bec6 62%, #ffffff 82%, #dfe2e6 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    filter:blur(26px);
    opacity:0;
    transform:scale(2.4);
    transform-origin:50% 55%;

    animation: rsd-word-focus 3.6s cubic-bezier(.16,1,.3,1) 1.1s forwards;
  }

  @keyframes rsd-word-focus{
    0%{ opacity:0; filter:blur(26px); transform:scale(2.4); letter-spacing:.62em; padding-right:.62em; }
    35%{ opacity:1; }
    100%{ opacity:1; filter:blur(0px); transform:scale(1); letter-spacing:.02em; padding-right:.02em; }
  }

  /* shine sweep — mirrors the word's own text via data-text so the
     highlight is clipped to the glyph shapes, not a rectangle */
  #rsd-cinema .rsd-word::before{
    content:attr(data-text);
    position:absolute;
    inset:0;
    text-transform:uppercase;
    font-weight:400;
    letter-spacing:.02em;
    background:linear-gradient(100deg,
      transparent 38%,
      rgba(255,255,255,.95) 50%,
      transparent 62%);
    background-size:300% 100%;
    background-position:180% 0;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:
      rsd-shine 2s ease-in-out 4.9s 1,
      rsd-shine 2.2s ease-in-out 10s infinite;
  }
  @keyframes rsd-shine{
    0%{ background-position:180% 0; opacity:0; }
    12%{ opacity:.9; }
    55%{ opacity:.9; }
    100%{ background-position:-120% 0; opacity:0; }
  }

  #rsd-cinema .rsd-rule{
    width:0;
    height:1px;
    margin:26px auto 0;
    background:linear-gradient(90deg, transparent, var(--rsd-red), transparent);
    animation: rsd-rule-in 1s cubic-bezier(.16,1,.3,1) 4.9s forwards;
  }
  @keyframes rsd-rule-in{ to{ width:180px; } }

  #rsd-cinema .rsd-tagline{
    margin:20px 0 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:clamp(11px, 1.6vw, 13px);
    letter-spacing:.5em;
    padding-left:.5em; /* balance trailing tracking so it stays centered */
    text-transform:uppercase;
    color:rgba(255,255,255,.7);
    opacity:0;
    animation: rsd-tagline-in 1.3s cubic-bezier(.16,1,.3,1) 5.2s forwards;
  }
  #rsd-cinema .rsd-tagline span{ color:var(--rsd-red); }
  @keyframes rsd-tagline-in{
    0%{ opacity:0; letter-spacing:.9em; padding-left:.9em; }
    100%{ opacity:1; letter-spacing:.5em; padding-left:.5em; }
  }

  @keyframes rsd-fade-in{ to{ opacity:1; } }

  @media (prefers-reduced-motion: reduce){
    #rsd-cinema .rsd-bar,
    #rsd-cinema .rsd-grain,
    #rsd-cinema .rsd-vignette,
    #rsd-cinema .rsd-embers,
    #rsd-cinema .rsd-glow,
    #rsd-cinema .rsd-stage,
    #rsd-cinema .rsd-kicker,
    #rsd-cinema .rsd-word,
    #rsd-cinema .rsd-word::before,
    #rsd-cinema .rsd-rule,
    #rsd-cinema .rsd-tagline{
      animation:none !important;
    }
    #rsd-cinema .rsd-bar{ height:6.4vh; }
    #rsd-cinema .rsd-grain{ opacity:.18; }
    #rsd-cinema .rsd-vignette,
    #rsd-cinema .rsd-embers,
    #rsd-cinema .rsd-kicker,
    #rsd-cinema .rsd-tagline{ opacity:1; }
    #rsd-cinema .rsd-glow{ opacity:.6; transform:scale(1); }
    #rsd-cinema .rsd-word{ opacity:1; filter:blur(0); transform:scale(1); letter-spacing:.02em; padding-right:.02em; }
    #rsd-cinema .rsd-rule{ width:180px; }
    #rsd-cinema .rsd-tagline{ letter-spacing:.5em; padding-left:.5em; }
  }

  /* preview-only replay control — delete for production */
  #rsd-replay{
    position:fixed;
    bottom:24px; left:50%; transform:translateX(-50%);
    z-index:10;
    background:transparent;
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:10px 18px;
    cursor:pointer;
  }
  #rsd-replay:hover{ border-color:#E2231A; color:#E2231A; }
</style>
</head>
<body>

<div id="rsd-cinema">
  <div class="rsd-bar top"></div>
  <div class="rsd-bar bottom"></div>
  <div class="rsd-grain"></div>
  <div class="rsd-vignette"></div>
  <div class="rsd-embers">
    <span class="rsd-ember"></span><span class="rsd-ember"></span><span class="rsd-ember"></span>
    <span class="rsd-ember"></span><span class="rsd-ember"></span><span class="rsd-ember"></span>
    <span class="rsd-ember"></span><span class="rsd-ember"></span><span class="rsd-ember"></span>
    <span class="rsd-ember"></span>
  </div>
  <div class="rsd-glow"></div>

  <div class="rsd-stage">
    <p class="rsd-kicker">Est. 2019 · ISO 9001:2015 Certified</p>
    <div class="rsd-word-wrap">
      <h1 class="rsd-word" data-text="Redsan Digitals">Redsan Digitals</h1>
    </div>
    <div class="rsd-rule"></div>
    <p class="rsd-tagline">Attention, <span>Mined.</span></p>
  </div>
</div>

<!-- PREVIEW-ONLY — remove before shipping -->
<button id="rsd-replay" onclick="location.reload();">Replay</button>

</body>
</html>
